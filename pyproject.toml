[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scikit-hopfield"
version = "0.1.0"
description = "Modern Hopfield Energy Estimators for scikit-learn and PyOD: OOD Detection (RecLag/SHE), Metastable Bifurcation Clustering, and Cross-Domain BAM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",

]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "hypothesis>=6",
    "mypy>=1.10"
]

[tool.hatch.build.targets.wheel]
packages = ["src/scikit_hopfield"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
