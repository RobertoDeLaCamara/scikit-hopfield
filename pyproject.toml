[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scikit-hopfield"
version = "0.1.0"
description = "Modern Continuous Hopfield Energy Estimators for scikit-learn: OOD Detection (RecLag/SHE), Metastable Bifurcation Clustering, and Cross-Domain BAM"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Roberto de la Cámara", email = "robcamgar@outlook.es" },
]
keywords = [
    "hopfield",
    "modern-hopfield-networks",
    "out-of-distribution",
    "anomaly-detection",
    "scikit-learn",
    "clustering",
    "associative-memory",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.6",
]

[project.urls]
Homepage = "https://github.com/RobertoDeLaCamara/scikit-hopfield"
Repository = "https://github.com/RobertoDeLaCamara/scikit-hopfield"
Issues = "https://github.com/RobertoDeLaCamara/scikit-hopfield/issues"
Changelog = "https://github.com/RobertoDeLaCamara/scikit-hopfield/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "hypothesis>=6",
    "mypy>=1.10"
]

[tool.hatch.build.targets.wheel]
packages = ["src/scikit_hopfield"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Compact research scripts (one-off validation runs); results are reproduced, not styled.
"examples/cnds_ids_ood_validation/**" = ["E", "W", "F403", "F405", "S101", "UP031", "B007"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true
